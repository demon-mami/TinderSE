<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>TinderSE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <div>
          <h1>TinderSE</h1>
          <p class="subtitle">タップで試聴、✓で採用</p>
        </div>
        <div class="summary" aria-live="polite">
          <span id="selectedCount">採用 0</span>
          <span id="playedCount">試聴 0</span>
        </div>
      </div>

      <nav id="categoryTabs" class="category-tabs" aria-label="カテゴリー"></nav>

      <div class="toolbar">
        <button id="selectedOnlyBtn" class="tool-btn" type="button" aria-pressed="false">採用のみ</button>
        <button id="unplayedOnlyBtn" class="tool-btn" type="button" aria-pressed="false">未試聴のみ</button>
        <button id="packBtn" class="tool-btn pack-btn" type="button">音源パック読込</button>
        <input id="packInput" type="file" accept=".pack,application/octet-stream" hidden>
        <span class="toolbar-spacer"></span>
        <button id="importBtn" class="tool-btn" type="button">CSV読込</button>
        <button id="exportBtn" class="tool-btn primary" type="button">CSV出力</button>
        <input id="importInput" type="file" accept=".csv,text/csv" hidden>
      </div>
    </header>

    <main>
      <section class="category-head">
        <div>
          <h2 id="categoryTitle">読み込み中…</h2>
          <p id="categoryMeta" class="category-meta"></p>
        </div>
        <div id="loadStatus" class="load-status">音源データを準備中</div>
      </section>

      <section id="soundGrid" class="sound-grid" aria-live="polite"></section>

      <section id="emptyState" class="empty-state" hidden>
        条件に一致する音源はありません。
      </section>
    </main>

    <footer class="compare-dock" aria-label="波形比較">
      <div class="compare-head">
        <div class="compare-current">
          <span class="compare-kicker">NOW</span>
          <span id="nowMain" class="compare-current-name">音源をタップしてください</span>
        </div>
        <button id="pinBtn" class="pin-btn" type="button" disabled>波形をピン止め</button>
      </div>

      <div class="wave-stage">
        <canvas id="waveCanvas" class="wave-canvas" aria-label="0msから130msまでの波形比較"></canvas>
        <div class="wave-axis" aria-hidden="true"><span>0 ms</span><span>130 ms</span></div>
      </div>

      <div class="wave-meta" aria-live="polite">
        <div class="wave-meta-row now">
          <span class="wave-swatch solid"></span>
          <span id="waveNowName" class="wave-name">NOW —</span>
          <span id="waveNowEc" class="wave-ec">Energy Centroid —</span>
        </div>
        <div class="wave-meta-row pin">
          <span class="wave-swatch dashed"></span>
          <span id="wavePinName" class="wave-name">PIN —</span>
          <span id="wavePinEc" class="wave-ec"></span>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
